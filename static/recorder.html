<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<script src="/AgoraRTC_N-4.20.0.js"></script>
<style>html,body{margin:0;background:#000}
video{opacity:0;position:absolute;left:0;top:0;width:1px;height:1px;pointer-events:none}
canvas{width:0;height:0}
</style>
</head><body>
<canvas id="cv" width="720" height="1280"></canvas>
<script>
// 录制页 v2(连麦/多主播):
//   - 主主播固定: 第一个视频源即主, 下播/连麦都不换人, 主画面一直是录的主播
//   - 嘉宾画中画: 右下角最多3个连线嘉宾同时显示
//   - 音频只混主主播(实际在录的), 嘉宾声音不录
//   - 连麦进入/退出/主播断流重连: 重发布即换轨恢复, MediaRecorder 全程不中断
// window.__REC__={appid,channel,token,uid,wsUrl,bitrate,audioBitrate,fps,mimeCands}
window.__STATE__={state:'init'};
const R = window.__REC__ || {};
const CV = document.getElementById('cv');
const CTX = CV.getContext('2d', {alpha:false});
let client=null, drawTimer=null, rec=null, ws=null;
let vw=720, vh=1280;
let masterUid=null;          // 当前主主播(画面+声音都以它为准)
const vids={};               // uid -> {video, track}
const audioTracks={};        // uid -> MediaStreamTrack(全部订阅的, 备用)
const audioSrcs={};          // uid -> AudioNode(只会有当前主的一个)
let audioCtx=null, audioDest=null, audActive=null;
let audioAny=false, videoAny=false;

function st(s){ window.__STATE__.state=s; console.log('[REC] '+s); }
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function uidKey(u){ return String(u); }

/* ---------- 视频轨管理: 每主播一个隐藏 video, 供 canvas 采集 ---------- */
function setupVideo(uid, track){
  const k=uidKey(uid);
  let vd=vids[k];
  try{
    if(vd){ // 重发布/换轨: 直接换 srcObject, 不 stop 旧轨(避免黑屏闪烁)
      try{ vd.video.srcObject=null; }catch(e){}
    } else {
      vd={video:document.createElement('video'), track:null};
      vd.video.autoplay=true; vd.video.muted=true; vd.video.playsInline=true;
      document.body.appendChild(vd.video);
      vids[k]=vd;
    }
    vd.track=track;
    try{ track.play(vd.video); }catch(e){}
    videoAny=true;
    window.__STATE__.peers = Object.keys(vids).filter(k=>hasData(vids[k])).length;
  }catch(e){ console.log('[REC] setupVideo err '+e); }
}

function hasData(vd){
  try{ return !!(vd && vd.video && vd.video.videoWidth>0 && vd.video.readyState>=2); }catch(e){ return false; }
}

function master(){
  // 主主播固定不变(不因断流/连麦换人): 只认 masterUid
  if(masterUid!==null && vids[masterUid] && hasData(vids[masterUid])) return vids[masterUid];
  return null;
}

function cleanupUid(uid, mt){
  const k=uidKey(uid);
  if(mt==='audio' || !mt){
    delete audioTracks[k];
    // 主主播音轨断了 -> 静音(不切嘉宾声音); 主主播重新发布时恢复
    if(audActive===k){
      if(audioSrcs[k]){ try{ audioSrcs[k].disconnect(); }catch(e){} delete audioSrcs[k]; }
      audActive=null;
    }
  }
  if(mt==='video' || !mt){
    if(vids[k]){
      try{ vids[k].video.srcObject=null; }catch(e){}
      try{ vids[k].video.remove(); }catch(e){}
      delete vids[k];
      // 主主播画面消失: 保持主身份不变(不换人), 录制画面黑屏等主播回来
    }
  }
}

/* ---------- 音频轨管理: 只混主主播声音, 主主播静音/断开也不切嘉宾 ---------- */
function activateAudio(uid, track){
  const k=uidKey(uid);
  try{
    if(audActive!==null && audActive!==k){
      if(audioSrcs[audActive]){ try{ audioSrcs[audActive].disconnect(); }catch(e){} delete audioSrcs[audActive]; }
      audActive=null;
    }
    if(audActive===k && audioSrcs[k]) return;   // 已激活跳过
    if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); audioDest = audioCtx.createMediaStreamDestination(); }
    const src = audioCtx.createMediaStreamSource(new MediaStream([track]));
    src.connect(audioDest);
    audioSrcs[k]=src;
    audActive=k;
  }catch(e){ console.log('[REC] activateAudio err '+e); }
}

/* 主主播锁定(按老大最终指令 m05216: 强制匹配 real_room_id, 不对就重试):
   真正要录的主播 = uid 等于服务器下发的 real_room_id 的那一路(R.realRoomId)。
   实测: 半糖连麦房 主播uid==real_room_id, 客播uid永远≠real_room_id。
   策略:
     1) realRoomId 已知: 只锁 uid==realRoomId; 该 uid 出了真帧即锁定。
        若一直等不到它出帧(可能换人过渡/尚未推流), 保留 realFrame 兜底但优先它。
     2) realRoomId 未知(接口 record not found/VIP): 退回"稳定出真帧"兜底。
     3) 主播换人: real_room_id 可能滞后, 用 _checkMasterAlive 迁移到"持续出真帧的另一 uid"。
   锁定后全程用这个 uid 认主播, 连麦绝不换; 一直录到主播下播。 */
let _lockTimer=null;
const _LOCK_POLL_MS=150;     // 密集轮询, 尽快抓第一个真正出画面的 uid
const _MIN_W=480;            // 真分辨率阈值(宽): 主播 540/720; 客播订阅初期 res=None/0
const TARGET = R.realRoomId ? String(R.realRoomId) : "";   // 目标主播uid(=real_room_id)

function realFrame(vd){
  try{ return !!(vd && vd.video && vd.video.videoWidth>=_MIN_W && vd.video.readyState>=2); }catch(e){ return false; }
}

function _doLock(uid, why){
  if(masterUid!==null) return;
  masterUid=uidKey(uid);
  if(_lockTimer){ clearInterval(_lockTimer); _lockTimer=null; }
  const t=audioTracks[masterUid];
  if(t) activateAudio(masterUid, t);
  try{ diag({ev:'masterLock', uid:masterUid, why:why, target:TARGET}); }catch(e){}
}

function _evalMaster(){
  if(masterUid!==null){ if(_lockTimer){clearInterval(_lockTimer);_lockTimer=null;} return; }
  // 1) 有 real_room_id: 强制等目标 uid 出真帧, 出了就锁(最高优先级)
  if(TARGET && vids[TARGET] && realFrame(vids[TARGET])){ _doLock(TARGET, 'realroom-match'); return; }
  // 2) 目标 uid 还没出帧(过渡/未推流): 先不锁, 继续等它; 
  //    但若已等了足够久且目标仍未出现, 才允许兜底锁别的稳定出帧 uid(防一直黑屏)
  if(TARGET){
    if(!_lockWaitStart) _lockWaitStart=Date.now();
    const waited = Date.now()-_lockWaitStart;
    if(vids[TARGET]===undefined && Object.keys(vids).length>0 && waited>_TARGET_GRACE_MS){
      // 目标 uid 根本没进房(可能换人): 兜底锁第一个真帧
      for(const k in vids){ if(realFrame(vids[k])){ _doLock(k, 'fallback-target-absent'); return; } }
    }
    return;  // 目标已订阅但还没出帧: 继续等
  }
  // 3) 无 real_room_id: 第一个真正出画面(realFrame)的 uid 兜底
  for(const k in vids){
    if(realFrame(vids[k])){ _doLock(k, 'first-real-frame-fallback'); return; }
  }
}

let _lockWaitStart=0;
const _TARGET_GRACE_MS=6000;   // 目标uid缺席多久后允许兜底锁别的uid

function ensureLockTimer(){
  if(masterUid===null && !_lockTimer && Object.keys(vids).length>0){
    _evalMaster();
    if(masterUid===null){ _lockTimer=setInterval(_evalMaster, _LOCK_POLL_MS); }
  }
}

/* 主播锁定后【永不换人】(老大最终指令 m05343):
   一旦 masterUid 锁定 = real_room_id, 主播后面换连麦对象/客播进出/主播短暂断流,
   都绝不再切换 masterUid。主播画面没了 master() 返回 null -> draw() 画黑屏继续录,
   MediaRecorder 全程不中断; 主播回来(同 uid 重新出帧)自动恢复画面。
   这里只做"存活监测+诊断日志", 不迁移、不换人。 */
let _masterLostAt=0;
function _checkMasterAlive(){
  if(masterUid===null) return;
  const mv=vids[masterUid];
  const alive=realFrame(mv);
  if(alive){ _masterLostAt=0; return; }
  if(!_masterLostAt){
    _masterLostAt=Date.now();
    try{ diag({ev:'masterLost', master:masterUid, why:'no-frame(保持锁不定不换人)'}); }catch(e){}
  }
  // 不迁移、不换人: 保持 masterUid, 黑屏等待主播回来
}

/* ---------- 画布采集: 只画主主播(不要画中画) ---------- */
function draw(){
  try{
    // 状态同步(供外部探针/调试用)
    window.__STATE__.masterUid = masterUid;
    window.__STATE__.videoCount = Object.keys(vids).length;
    window.__STATE__.peers = Object.keys(vids).filter(k=>hasData(vids[k])).length;
    const mv = master();
    if(mv){
      const w=mv.video.videoWidth, h=mv.video.videoHeight;
      if(w!==vw || h!==vh){ vw=w; vh=h; CV.width=vw; CV.height=vh; window.__STATE__.resChanged=(window.__STATE__.resChanged||0)+1; }
      CTX.drawImage(mv.video, 0, 0, vw, vh);
    } else {
      CTX.fillStyle='#000'; CTX.fillRect(0,0,vw,vh);
    }
  }catch(e){}
  drawTimer=requestAnimationFrame(draw);
}


function diag(obj){
  try{
    obj.__diag__ = true;
    obj.ts = new Date().toISOString().slice(11,19);
    window.__STATE__.lastDiag = JSON.stringify(obj).slice(0,400);
    if(ws && ws.readyState===1){ ws.send(JSON.stringify(obj)); }
  }catch(e){}
}
window.addEventListener('beforeunload', ()=>{ try{ diag({ev:'unload', st:JSON.stringify(window.__STATE__).slice(0,300)}); }catch(_){} });
window.addEventListener('pagehide', ()=>{ try{ diag({ev:'pagehide', vis:document.visibilityState, st:JSON.stringify(window.__STATE__).slice(0,300)}); }catch(_){} });
document.addEventListener('visibilitychange', ()=>{ try{ diag({ev:'vis', vis:document.visibilityState}); }catch(_){} });

/* ---------- 主流程 ---------- */
async function main(){
  st('joining');
  client = AgoraRTC.createClient({mode:'live', codec:'h264'});

  client.on('connection-state-change', (cur, rev)=>{
    try{
      const st = window.__STATE__;
      st.connState = cur;
      st.connPrev = rev;
      st.connChanges = (st.connChanges||0)+1;
      window.__STATE__.lastDiag = 'conn '+rev+'->'+cur;
      diag({ev:'conn', from:rev, to:cur});
    }catch(e){}
  });
  window.__STATE__.connState = 'init';
  window.addEventListener('error', (e)=>{
    try{
      const d = {ev:'pageerror', msg:(e.message||'').slice(0,200), file:(e.filename||'').slice(-60), line:e.lineno};
      window.__STATE__.pageErrors=(window.__STATE__.pageErrors||0)+1;
      diag(d);
    }catch(_){}
  });
  window.addEventListener('unhandledrejection', (e)=>{
    try{
      diag({ev:'rejection', msg:String(e.reason&&e.reason.message||e.reason||'').slice(0,200)});
      window.__STATE__.unhandled=(window.__STATE__.unhandled||0)+1;
    }catch(_){}
  });
client.on('user-published', async (user, mt)=>{
    try{ diag({ev:'pub', uid:uidKey(user.uid), mt:mt, n:(window.__STATE__.pubN=(window.__STATE__.pubN||0)+1), ms:performance.now()|0}); }catch(e){}
    try{ await client.subscribe(user, mt); }catch(e){}
    if(mt==='video'){
      try{ client.setRemoteVideoStreamType(user.uid, 0); }catch(e){}
      setupVideo(user.uid, user.videoTrack);
      // 主播锁定: 强制匹配 real_room_id(见 _evalMaster); 目标 uid 出了真帧即锁
      if(masterUid===null){ ensureLockTimer(); }
      // 主播重新发布(重连/换轨)时, 若是当前主身份则重置失联计时
      if(masterUid!==null && uidKey(user.uid)===masterUid){ _masterLostAt=0; }
      // 只在还没开录时置 video-ready 并尝试开录; 已在 recording 不得重置状态
      // (否则后端轮询等不到 recording 会 25s 超时误杀页面 -> 无限重启)
      if(!recStarted){ st('video-ready'); tryStartRecord(); }
    }
    if(mt==='audio'){
      const mt2 = user.audioTrack && user.audioTrack.getMediaStreamTrack && user.audioTrack.getMediaStreamTrack();
      if(mt2){
        audioTracks[uidKey(user.uid)] = mt2;
        if(masterUid===uidKey(user.uid)){ activateAudio(user.uid, mt2); }
      }
      window.__STATE__.audio=true;
      audioAny=true;
      tryStartRecord();
    }
  });
  client.on('user-unpublished', async (user, mt)=>{
    try{ await client.unsubscribe(user, mt); }catch(e){}
    cleanupUid(user.uid, mt);
  });
  client.on('user-left', (user)=>{
    cleanupUid(user.uid, 'video');
    cleanupUid(user.uid, 'audio');
  });

  try{
    await client.join(R.appid, R.channel, R.token, R.uid||0);
    st('joined');
    const t0=Date.now();
    while(!(videoAny || audioAny) && Date.now()-t0<15000){ await sleep(200); }
    startRecord();
  }catch(e){ st('join-fail:'+e); }
}

let recStarted=false;
function tryStartRecord(){
  if(recStarted) return;
  if(videoAny || audioAny){
    try{ startRecord(); }catch(e){ console.log('[REC] start early err '+e); }
  }
}

function startRecord(){
  if(recStarted) return; recStarted=true;
  draw();
  const vidStream = CV.captureStream(R.fps||20);
  // 合并混音后的音轨
  let finalStream = vidStream;
  try{
    if(audioDest && audioDest.stream.getAudioTracks().length){
      finalStream = new MediaStream([...vidStream.getVideoTracks(), ...audioDest.stream.getAudioTracks()]);
    }
  }catch(e){ console.log('[REC] merge audio err '+e); }

  const mimeCands = R.mimeCands && R.mimeCands.length ? R.mimeCands : ['video/webm;codecs=h264,opus','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime = mimeCands.find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
  rec = new MediaRecorder(finalStream, {mimeType:mime, videoBitsPerSecond: R.bitrate||2500000, audioBitsPerSecond: R.audioBitrate||128000});
  st('recording');
  window.__STATE__.recording=true; window.__STATE__.mime=mime; window.__STATE__.hasAudio=(finalStream.getAudioTracks().length>0);

  ws = new WebSocket(R.wsUrl);
  ws.binaryType='arraybuffer';
  ws.onopen=()=>{
    console.log('[REC] ws open');
    try{ ws.send(JSON.stringify({__mime__:mime})); }catch(e){}
    try{ rec.start(1000); }catch(e){ st('rec-start-err:'+e); }
  };
  ws.onerror=()=>console.log('[REC] ws err');
  ws.onclose=()=>{ window.__STATE__.wsClosed=true; try{ diag({ev:'wsclose'}); }catch(_){} };
  rec.ondataavailable = async (e)=>{
    if(e.data && e.data.size>0 && ws && ws.readyState===1){
      try{
        const buf = await e.data.arrayBuffer();
        ws.send(buf);
        window.__STATE__.bytes = (window.__STATE__.bytes||0)+buf.byteLength;
      }catch(err){ console.log('[REC] send err '+err); }
    }
  };
}

// 页面级看门狗: 每秒检查一次 MediaRecorder/ws 存活, 抛异常进 diag(不中断录制)
let _dbgTick=0;
setInterval(()=>{
  try{
    // 诊断: 前20秒每3秒 dump 一次 uid 到达顺序+videoWidth(定位主播选择), 之后不再刷屏
    if(++_dbgTick<=7 && _dbgTick%3===0){
      const snap={}; const order=[];
      for(const k in vids){
        let w=0,h=0,rs=0;
        try{ w=vids[k].video.videoWidth||0; h=vids[k].video.videoHeight||0; rs=vids[k].video.readyState||0; }catch(e){}
        snap[k]=w+'x'+h+' rs'+rs;
        order.push(k);
      }
      diag({ev:'vidSnap', master:masterUid, order:order.join(','), snap:snap});
    }
    // 主播失联/重连/换人: 检测并迁移主身份(防黑屏)
    _checkMasterAlive();
    if(rec && document.visibilityState==='visible'){
      if(rec.state!=='recording' && rec.state!=='inactive'){        diag({ev:'recstate', cur:rec.state, mime:window.__STATE__.mime, hasAudio:window.__STATE__.hasAudio, bytes:window.__STATE__.bytes||0});
      }
      if(!ws || ws.readyState!==1){
        diag({ev:'wsdead', ready:ws?ws.readyState:-1});
      }
      if(masterUid!==null && !vids[masterUid] && Date.now()-(window.__STATE__.lastMasterSeen||0)>10000){
        diag({ev:'nomaster', masterUid:masterUid, vids:Object.keys(vids).length});
      }
      if(vids[masterUid] && vids[masterUid].video && vids[masterUid].video.videoWidth>0){
        window.__STATE__.lastMasterSeen=Date.now();
      }
    }
  }catch(_){}
},1000);

window.__STOP__ = async function(){
  return new Promise(res=>{
    try{ if(drawTimer) cancelAnimationFrame(drawTimer); }catch(e){}
    try{ for(const k in vids){ try{vids[k].video.srcObject=null;}catch(e){} } }catch(e){}
    if(rec && rec.state!=='inactive'){
      rec.onstop=()=>{ try{ws&&ws.send(JSON.stringify({__end__:true}));}catch(e){} try{ws&&ws.close();}catch(e){} st('stopped'); res(true); };
      rec.stop();
    } else { try{ws&&ws.close();}catch(e){} st('stopped'); res(true); }
  });
};

main();
</script></body></html>
